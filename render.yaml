# CareerOS Render deployment blueprint
# Apply via Render Dashboard → New → Blueprint, or `render blueprint sync`

databases:
  - name: careeros-db
    plan: free
    databaseName: careeros
    user: careeros

services:
  - type: web
    name: careeros-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: CAREEROS_ENV
        value: production
      - key: API_PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: careeros-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: 168
      - key: CORS_ORIGIN
        value: https://careeros-web.onrender.com
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: None
      - key: METRICS_ENABLED
        value: false
      - key: CAREEROS_ADMIN_EMAILS
        value: enockowusuansah02@gmail.com
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
      - key: LOG_LEVEL
        value: info
    buildCommand: ""
    # Migrations run automatically via infrastructure/docker/entrypoint-api.sh

  # Background workers require a paid Render plan ($7/mo+). Add later for async job queue.
  # - type: worker
  #   name: careeros-worker
  #   ...

  # Cron jobs require a paid plan (~$1/mo). Run initial ingest manually after deploy:
  #   DATABASE_URL=... USAJOBS_API_KEY=... USAJOBS_USER_AGENT=... make ingest
  # To enable scheduled ingest later, uncomment and set plan: starter on the cron service.
  # - type: cron
  #   name: careeros-ingest
  #   runtime: docker
  #   dockerfilePath: ./infrastructure/docker/Dockerfile.ingest
  #   dockerContext: .
  #   schedule: "0 */6 * * *"
  #   plan: starter
  #   envVars:
  #     - key: DATABASE_URL
  #       fromService:
  #         name: careeros-api
  #         type: web
  #         envVarKey: DATABASE_URL
  #     - key: LOG_LEVEL
  #       value: info
  #     - key: USAJOBS_API_KEY
  #       fromService:
  #         name: careeros-api
  #         type: web
  #         envVarKey: USAJOBS_API_KEY
  #     - key: USAJOBS_USER_AGENT
  #       fromService:
  #         name: careeros-api
  #         type: web
  #         envVarKey: USAJOBS_USER_AGENT

  - type: web
    name: careeros-web
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://careeros-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
