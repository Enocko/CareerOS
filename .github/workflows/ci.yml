name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: careeros
          POSTGRES_DB: careeros
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U careeros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://careeros:careeros@localhost:5433/careeros?sslmode=disable
      JWT_SECRET: ci-test-secret-at-least-16-chars
      CORS_ORIGIN: http://localhost:5173
      METRICS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Install migrate CLI
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz migrate
          sudo mv migrate /usr/local/bin/migrate
      - name: Run migrations
        run: migrate -path apps/api/migrations -database "$DATABASE_URL" up
      - name: Go test
        working-directory: apps/api
        run: go test -p 1 -count=1 -timeout 10m ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
