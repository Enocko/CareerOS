services:
  postgres:
    image: postgres:16-alpine
    container_name: careeros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careeros
      POSTGRES_PASSWORD: careeros
      POSTGRES_DB: careeros
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careeros -d careeros"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.1
    container_name: careeros-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps/api/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://careeros:careeros@postgres:5432/careeros?sslmode=disable"
      - "up"
    restart: "no"

volumes:
  postgres_data:
